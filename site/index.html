<section id="regelwerk">
<div style="max-width: 1200px; margin: 0 auto; padding: 72px 24px 112px">
<div style="display: flex; flex-direction: column; gap: 24px; max-width: 760px; padding-bottom: 56px">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.25em; text-transform: uppercase; color: {{accentText}}">Regelwerk</div>
<h1 style="margin: 0; font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: clamp(52px, 7vw, 96px); line-height: 0.92; text-transform: uppercase">Die Regeln des Beasts.</h1>
<p style="margin: 0; color: #D6D6D6; font-size: 20px">Jede Stunde eine Loop. Wer nicht rechtzeitig zurück ist, ist raus. Hier steht alles, was du vor dem Start wissen musst.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 24px; padding: 48px 0 0">
<h2 style="margin: 0; font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: clamp(34px, 4vw, 52px); line-height: 1; text-transform: uppercase">Der Start</h2>
<ol style="list-style: none; margin: 0; padding: 0; border-bottom: 1px solid #2A2A2A; min-width: 0">
<li style="display: grid; grid-template-columns: 56px 1fr; gap: 16px; align-items: baseline; border-top: 1px solid #2A2A2A; padding: 20px 0"><span style="font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 26px; line-height: 1; color: {{accentText}}">01</span><span style="color: #D6D6D6; font-size: 20px">Alle Läufer und Läuferinnen starten gleichzeitig aus dem markierten Start-/Zielbereich heraus, jeweils zur vollen Stunde, auf eine 6,706 km lange Loop.</span></li>
<li style="display: grid; grid-template-columns: 56px 1fr; gap: 16px; align-items: baseline; border-top: 1px solid #2A2A2A; padding: 20px 0"><span style="font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 26px; line-height: 1; color: {{accentText}}">02</span><span style="color: #D6D6D6; font-size: 20px">Der Start wird drei Minuten vorher durch dreimaliges Pfeifen, zwei Minuten vorher durch zweimaliges Pfeifen und eine Minute vorher durch einmaliges Pfeifen angekündigt. Zum Start der Loop wird eine Glocke geläutet.</span></li>
<li style="display: grid; grid-template-columns: 56px 1fr; gap: 16px; align-items: baseline; border-top: 1px solid #2A2A2A; padding: 20px 0"><span style="font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 26px; line-height: 1; color: {{accentText}}">03</span><span style="color: #D6D6D6; font-size: 20px">Wer nicht direkt nach Ertönen der Glocke startet, für den ist der Wettkampf beendet.</span></li>
</ol>
</div>
<div style="display: flex; flex-direction: column; gap: 24px; padding: 48px 0 0">
<h2 style="margin: 0; font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: clamp(34px, 4vw, 52px); line-height: 1; text-transform: uppercase">Die Loop</h2>
<ol style="list-style: none; margin: 0; padding: 0; border-bottom: 1px solid #2A2A2A; min-width: 0">
<li style="display: grid; grid-template-columns: 56px 1fr; gap: 16px; align-items: baseline; border-top: 1px solid #2A2A2A; padding: 20px 0"><span style="font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 26px; line-height: 1; color: {{accentText}}">04</span><span style="color: #D6D6D6; font-size: 20px">Für die 6,706 km haben die Läufer und Läuferinnen exakt eine Stunde Zeit. Wer nicht rechtzeitig zurück im Start-/Zielbereich ist, für den ist das Rennen beendet. Die nicht rechtzeitig vollendete Loop geht nicht in die Wertung ein.</span></li>
<li style="display: grid; grid-template-columns: 56px 1fr; gap: 16px; align-items: baseline; border-top: 1px solid #2A2A2A; padding: 20px 0"><span style="font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 26px; line-height: 1; color: {{accentText}}">05</span><span style="color: #D6D6D6; font-size: 20px">Niemand darf vor Beendigung seiner Loop die Strecke verlassen. Einzige Ausnahme ist ein Toilettengang.</span></li>
<li style="display: grid; grid-template-columns: 56px 1fr; gap: 16px; align-items: baseline; border-top: 1px solid #2A2A2A; padding: 20px 0"><span style="font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 26px; line-height: 1; color: {{accentText}}">06</span><span style="color: #D6D6D6; font-size: 20px">Wer vor Vollendung der Loop in den Start-/Zielbereich zurückkehrt, für den ist der Wettkampf beendet.</span></li>
<li style="display: grid; grid-template-columns: 56px 1fr; gap: 16px; align-items: baseline; border-top: 1px solid #2A2A2A; padding: 20px 0"><span style="font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 26px; line-height: 1; color: {{accentText}}">07</span><span style="color: #D6D6D6; font-size: 20px">Die Loop ist tagsüber und nachts die gleiche. Es gibt keine gesonderte Route für die Nacht.</span></li>
</ol>
</div>
<div style="display: flex; flex-direction: column; gap: 24px; padding: 48px 0 0">
<h2 style="margin: 0; font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: clamp(34px, 4vw, 52px); line-height: 1; text-transform: uppercase">Auf der Strecke</h2>
<ol style="list-style: none; margin: 0; padding: 0; border-bottom: 1px solid #2A2A2A; min-width: 0">
<li style="display: grid; grid-template-columns: 56px 1fr; gap: 16px; align-items: baseline; border-top: 1px solid #2A2A2A; padding: 20px 0"><span style="font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 26px; line-height: 1; color: {{accentText}}">08</span><span style="color: #D6D6D6; font-size: 20px">Es ist keinerlei Begleitung auf der Strecke durch Nicht-Teilnehmer erlaubt.</span></li>
<li style="display: grid; grid-template-columns: 56px 1fr; gap: 16px; align-items: baseline; border-top: 1px solid #2A2A2A; padding: 20px 0"><span style="font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 26px; line-height: 1; color: {{accentText}}">09</span><span style="color: #D6D6D6; font-size: 20px">Persönliche Hilfe auf der Strecke ist nicht erlaubt. Teilnehmer dürfen sich aber gegenseitig aushelfen, zum Beispiel mit Verpflegung. Eigene Verpflegung darf selbstverständlich mit auf die Strecke genommen werden.</span></li>
<li style="display: grid; grid-template-columns: 56px 1fr; gap: 16px; align-items: baseline; border-top: 1px solid #2A2A2A; padding: 20px 0"><span style="font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 26px; line-height: 1; color: {{accentText}}">10</span><span style="color: #D6D6D6; font-size: 20px">Es sind keine künstlichen Hilfsmittel erlaubt, also auch keine Trekking-Stöcke.</span></li>
<li style="display: grid; grid-template-columns: 56px 1fr; gap: 16px; align-items: baseline; border-top: 1px solid #2A2A2A; padding: 20px 0"><span style="font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 26px; line-height: 1; color: {{accentText}}">11</span><span style="color: #D6D6D6; font-size: 20px">Zwischen 21:00 Uhr abends und 6:00 Uhr morgens sind Stirnlampen zu tragen.</span></li>
<li style="display: grid; grid-template-columns: 56px 1fr; gap: 16px; align-items: baseline; border-top: 1px solid #2A2A2A; padding: 20px 0"><span style="font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 26px; line-height: 1; color: {{accentText}}">12</span><span style="color: #D6D6D6; font-size: 20px">Langsamere Läufer und Läuferinnen müssen schnellere vorbeilassen. Auf der breiten Strecke ist das aber kein Problem.</span></li>
</ol>
</div>
<div style="display: flex; flex-direction: column; gap: 24px; padding: 48px 0 0">
<h2 style="margin: 0; font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: clamp(34px, 4vw, 52px); line-height: 1; text-transform: uppercase">Die Wertung</h2>
<ol style="list-style: none; margin: 0; padding: 0; border-bottom: 1px solid #2A2A2A; min-width: 0">
<li style="display: grid; grid-template-columns: 56px 1fr; gap: 16px; align-items: baseline; border-top: 1px solid #2A2A2A; padding: 20px 0"><span style="font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 26px; line-height: 1; color: {{accentText}}">13</span><span style="color: #D6D6D6; font-size: 20px">Der Wettkampf ist zeitlich nicht begrenzt.</span></li>
<li style="display: grid; grid-template-columns: 56px 1fr; gap: 16px; align-items: baseline; border-top: 1px solid #2A2A2A; padding: 20px 0"><span style="font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 26px; line-height: 1; color: {{accentText}}">14</span><span style="color: #D6D6D6; font-size: 20px">Gewinner bzw. Gewinnerin ist die Person, die als Einzige eine Loop mehr als alle anderen absolviert hat. Auch diese letzte Loop muss innerhalb der Stunde rechtzeitig beendet werden.</span></li>
<li style="display: grid; grid-template-columns: 56px 1fr; gap: 16px; align-items: baseline; border-top: 1px solid #2A2A2A; padding: 20px 0"><span style="font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 26px; line-height: 1; color: {{accentText}}">15</span><span style="color: #D6D6D6; font-size: 20px">Alle anderen außer dem Sieger bzw. der Siegerin erhalten ein DNF.</span></li>
<li style="display: grid; grid-template-columns: 56px 1fr; gap: 16px; align-items: baseline; border-top: 1px solid #2A2A2A; padding: 20px 0"><span style="font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 26px; line-height: 1; color: {{accentText}}">16</span><span style="color: #D6D6D6; font-size: 20px">Hat niemand innerhalb des Zeitlimits eine Loop mehr als alle anderen absolviert, gibt es keinen Sieger bzw. keine Siegerin.</span></li>
</ol>
</div>

<script>
/* Beat the Beast Ultra – kleiner Seiten-Renderer (ersetzt die Design-Vorschau-Laufzeit) */
(function () {
  var VOID = { area: 1, base: 1, br: 1, col: 1, embed: 1, hr: 1, img: 1, input: 1, link: 1, meta: 1, source: 1, track: 1, wbr: 1 };
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function lookup(path, scope) {
    if (path === 'true') return true;
    if (path === 'false') return false;
    var parts = path.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++) {
      if (v == null) return undefined;
      v = v[parts[i]];
    }
    return v;
  }
  function single(str) {
    var m = /^\{\{\s*([^}]+?)\s*\}\}$/.exec(str.trim());
    return m ? m[1] : null;
  }
  function fill(str, scope) {
    return str.replace(HOLE, function (_, p) {
      var v = lookup(p, scope);
      return v == null ? '' : String(v);
    });
  }

  function renderNodes(nodes, scope, ctx) {
    var out = '';
    for (var i = 0; i < nodes.length; i++) out += renderNode(nodes[i], scope, ctx);
    return out;
  }
  function renderNode(n, scope, ctx) {
    if (n.nodeType === 3) return esc(fill(n.nodeValue, scope)).replace(/&quot;/g, '"');
    if (n.nodeType !== 1) return '';
    var tag = n.tagName.toLowerCase();
    if (tag === 'sc-for') {
      var list = lookup(single(n.getAttribute('list')), scope) || [];
      var as = n.getAttribute('as'), out = '';
      for (var j = 0; j < list.length; j++) {
        var s = Object.create(scope);
        s[as] = list[j];
        out += renderNodes(n.childNodes, s, ctx);
      }
      return out;
    }
    if (tag === 'sc-if') {
      return lookup(single(n.getAttribute('value')), scope) ? renderNodes(n.childNodes, scope, ctx) : '';
    }
    var html = '<' + tag;
    for (var k = 0; k < n.attributes.length; k++) {
      var a = n.attributes[k], name = a.name;
      if (name.indexOf('hint-') === 0) continue;
      if (name === 'onclick') {
        var fn = lookup(single(a.value), scope);
        if (typeof fn === 'function') {
          ctx.handlers.push(fn);
          html += ' data-on-click="' + (ctx.handlers.length - 1) + '"';
        }
        continue;
      }
      html += ' ' + name + '="' + esc(fill(a.value, scope)) + '"';
    }
    html += '>';
    if (VOID[tag]) return html;
    return html + renderNodes(n.childNodes, scope, ctx) + '</' + tag + '>';
  }

  // Minimaler DOM-Abgleich, damit Animationen und Fokus beim Neuzeichnen erhalten bleiben
  function morph(from, to) {
    if (from.nodeType !== to.nodeType || from.nodeName !== to.nodeName) {
      from.parentNode.replaceChild(to.cloneNode(true), from);
      return;
    }
    if (from.nodeType === 3) {
      if (from.nodeValue !== to.nodeValue) from.nodeValue = to.nodeValue;
      return;
    }
    if (from.nodeType !== 1) return;
    var i, a;
    for (i = from.attributes.length - 1; i >= 0; i--) {
      a = from.attributes[i];
      if (!to.hasAttribute(a.name)) from.removeAttribute(a.name);
    }
    for (i = 0; i < to.attributes.length; i++) {
      a = to.attributes[i];
      if (from.getAttribute(a.name) !== a.value) from.setAttribute(a.name, a.value);
    }
    morphChildren(from, to);
  }
  function morphChildren(from, to) {
    var fk = from.childNodes, tk = to.childNodes, i;
    for (i = 0; i < tk.length; i++) {
      if (i < fk.length) morph(fk[i], tk[i]);
      else from.appendChild(tk[i].cloneNode(true));
    }
    while (fk.length > tk.length) from.removeChild(fk[fk.length - 1]);
  }

  function DCLogic(props) {
    this.props = props || {};
    this.state = {};
  }
  DCLogic.prototype.setState = function (patch) {
    var s = {}, k;
    for (k in this.state) s[k] = this.state[k];
    for (k in patch) s[k] = patch[k];
    this.state = s;
    this.forceUpdate();
  };
  DCLogic.prototype.forceUpdate = function () {
    if (this.__render) this.__render();
  };
  DCLogic.prototype.renderVals = function () { return {}; };
  window.DCLogic = DCLogic;

  window.mountPage = function (Component, tplId, rootId) {
    var tpl = document.getElementById(tplId || 'page-template');
    var root = document.getElementById(rootId || 'page');
    var comp = new Component({});
    var ctx = { handlers: [] };
    comp.__render = function () {
      ctx.handlers = [];
      var html = renderNodes(tpl.content.childNodes, comp.renderVals(), ctx);
      var next = document.createElement('div');
      next.innerHTML = html;
      morphChildren(root, next);
    };
    root.addEventListener('click', function (e) {
      var el = e.target.closest('[data-on-click]');
      if (!el) return;
      var fn = ctx.handlers[+el.getAttribute('data-on-click')];
      if (fn) fn(e);
    });
    comp.__render();
    if (comp.componentDidMount) comp.componentDidMount();
  };
})();

var views = {};
views["start"] = (function () {
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => this.forceUpdate(), 1000);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  renderVals() {
    const accent = this.props.accent ?? '#EA632B';
    const accentText = this.props.accentText ?? '#EA632B';
    const target = new Date('2027-05-01T10:00:00+02:00');
    let ms = target.getTime() - Date.now();
    if (!(ms > 0)) ms = 0;
    const s = Math.floor(ms / 1000);
    const pad = (n) => String(n).padStart(2, '0');
    return {
      accent: accent, accentText: accentText,
      days: String(Math.floor(s / 86400)),
      hours: pad(Math.floor((s % 86400) / 3600)),
      minutes: pad(Math.floor((s % 3600) / 60)),
      seconds: pad(s % 60)
    };
  }
}
return Component;
})();
views["teilnehmer-seite"] = (function () {
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#EA632B';
    const accentText = this.props.accentText ?? '#EA632B';

    // Teilnehmerdaten: pro Startnummer ein Eintrag. first = erster Backyard.
    const people = {
      // Beispiel: 1: { name: 'Vorname Nachname', age: '35', town: 'Kiel', club: 'Lauftreff', best: '12 Loops', first: false, last: 'Beat the Beast 2026 · 12 Loops', goal: '15 Loops', beast: 'Die Nacht' },
    };
    const total = 200;
    const st = this.state || {};
    const filter = st.filter || 'all';
    const sel = people[st.sel] ? st.sel : 1;
    const sp = people[sel];

    const slots = [];
    for (let nr = 1; nr <= total; nr++) {
      const p = people[nr];
      const taken = !!p;
      const show = filter === 'all' || (filter === 'free' && !taken) ||
        (filter === 'first' && taken && p.first) || (filter === 'exp' && taken && !p.first);
      if (!show) continue;
      const on = taken && nr === sel;
      slots.push({
        nr: String(nr), taken: taken, free: !taken,
        name: taken ? p.name : '', isBeast: !!(taken && p.isBeast),
        age: taken ? p.age : '', town: taken ? p.town : '', club: taken ? p.club : '',
        exp: taken ? (p.first ? 'Erster Backyard' : 'Erfahren') : '',
        best: taken ? (p.best || '–') : '', goal: taken ? p.goal : '', beast: taken ? p.beast : '',
        rowBg: on ? '#2A1406' : (nr % 2 ? '#0A0A0A' : '#0D0D0D'),
        mark: on ? accent : 'transparent',
        pick: () => this.setState({ sel: nr })
      });
    }
    const defs = [['all', 'Alle'], ['first', 'Erster Backyard'], ['exp', 'Backyard-erfahren'], ['free', 'Freie Plätze']];
    const filters = defs.map(([key, label]) => ({
      label: label, pressed: filter === key ? 'true' : 'false',
      bg: filter === key ? '#F5F5F5' : 'transparent', fg: filter === key ? '#0A0A0A' : '#F5F5F5',
      bd: filter === key ? '#F5F5F5' : '#4A4A4A',
      pick: () => this.setState({ filter: key })
    }));

    return {
      accent: accent, accentText: accentText,
      total: String(total),
      takenCount: String(Object.keys(people).length),
      slots: slots, noSlots: slots.length === 0, filters: filters,
      hasSel: !!sp,
      selNr: String(sel), selName: sp ? sp.name : '', selAge: sp ? sp.age : '', selTown: sp ? sp.town : '',
      selExp: sp ? (sp.first ? 'Erster Backyard' : 'Backyard-erfahren') : '',
      selLast: sp ? (sp.first ? '–' : sp.last) : '', selGoal: sp ? sp.goal : '', selClub: sp ? sp.club : '', selBest: sp ? (sp.best || '–') : '', selBeast: sp ? sp.beast : '',
      selIsBeast: !!(sp && sp.isBeast)
    };
  }
}
return Component;
})();
views["hall-of-fame"] = (function () {
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#EA632B', accentText: this.props.accentText ?? '#EA632B' };

return Component;

views["raceboard"] = (function () {
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => this.forceUpdate(), 500);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  simNow(speed) {
    if (this.realBase == null) {
      this.realBase = Date.now();
      this.simBase = 7 * 3600 + 18 * 60; // Demo: Loop 8, Minute 18
    }
    return this.simBase + (Date.now() - this.realBase) / 1000 * speed;
  }
  renderVals() {
    const accent = this.props.accent ?? '#EA632B';
    const accentText = this.props.accentText ?? '#EA632B';
    const st = this.state || {};
    const speed = st.speed || 30;
    const sim = this.simNow(speed);

    // Streckenverlauf (aus der Strava-Route nachgezeichnet), Koordinaten im Kartenraster
    const pts = [[745,1695],[860,1715],[860,1737],[705,1740],[712,1640],[722,1590],[725,1520],[420,1530],[130,1545],[150,1440],[180,1250],[175,1095],[500,1065],[717,1070],[705,875],[925,865],[930,940],[1005,950],[1008,1075],[750,1075],[725,1415],[830,1420],[935,1425],[955,1355],[995,1335],[1020,1535],[975,1575],[965,1615],[735,1610],[745,1695]];
    const cum = [0];
    for (let i = 1; i < pts.length; i++) {
      cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    }
    const len = cum[cum.length - 1];
    const at = (f) => {
      const d = Math.max(0, Math.min(1, f)) * len;
      let i = 1;
      while (i < cum.length - 1 && cum[i] < d) i++;
      const t = (d - cum[i - 1]) / (cum[i] - cum[i - 1] || 1);
      return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * t, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * t];
    };

    // Demo-Teilnehmer: pace = Minuten pro Loop, outAfter = letzte geschaffte Loop
    // Teilnehmer kommen am Renntag hierher, z. B. { nr: 1, name: 'Vorname Nachname', pace: 45, beast: true }
    const field = [];

    const round = Math.floor(sim / 3600) + 1;
    const min = (sim % 3600) / 60;
    const left = Math.max(0, 3600 - (sim % 3600));
    const pad = (n) => String(Math.floor(n)).padStart(2, '0');
    const sel = st.sel || 1;

    let onCourse = 0, inCorral = 0, out = 0, corralIdx = 0;
    const dots = [];
    const runners = field.map((r) => {
      const isOut = r.outAfter != null && round > r.outAfter;
      const running = !isOut && min < r.pace;
      const frac = isOut ? 0 : (running ? min / r.pace : 1);
      let status, statusColor;
      if (isOut) { out++; status = 'Raus nach Loop ' + r.outAfter; statusColor = '#8E8E8E'; }
      else if (running) { onCourse++; status = 'Auf der Strecke'; statusColor = '#F5F5F5'; }
      else { inCorral++; status = 'Startbereich'; statusColor = accentText; }
      const on = r.nr === sel;
      if (!isOut) {
        let [x, y] = at(frac);
        if (!running) { x += ((corralIdx % 4) - 1.5) * 26; y -= 30 + Math.floor(corralIdx / 4) * 26; corralIdx++; }
        dots.push({
          nr: String(r.nr),
          left: ((x - 80) / 1000 * 100).toFixed(2) + '%',
          top: ((y - 820) / 960 * 100).toFixed(2) + '%',
          size: on ? '34px' : '24px',
          bg: r.beast ? '#F5F5F5' : (on ? accent : '#2A2A2A'),
          fg: r.beast ? '#0A0A0A' : (on ? '#0A0A0A' : '#F5F5F5'),
          ring: r.beast || on ? accent : '#F5F5F5',
          z: on ? '3' : (r.beast ? '2' : '1')
        });
      }
      return {
        nr: String(r.nr), name: r.name, isBeast: !!r.beast, status: status, statusColor: statusColor,
        pct: (frac * 100).toFixed(1) + '%',
        km: isOut ? '–' : (frac * 6.7).toFixed(1).replace('.', ',') + ' km',
        barColor: isOut ? '#3A3A3A' : (running ? accent : '#767676'),
        rowBg: on ? '#2A1406' : 'transparent', mark: on ? accent : 'transparent',
        nrColor: isOut ? '#767676' : '#F5F5F5', nameColor: isOut ? '#8E8E8E' : '#F5F5F5',
        pick: () => this.setState({ sel: r.nr })
      };
    });

    const speeds = [[1, 'Echtzeit'], [30, '30×'], [120, '120×']].map(([v, label]) => ({
      label: label, pressed: speed === v ? 'true' : 'false',
      bg: speed === v ? '#F5F5F5' : 'transparent', fg: speed === v ? '#0A0A0A' : '#F5F5F5',
      bd: speed === v ? '#F5F5F5' : '#4A4A4A',
      pick: () => {
        this.simBase = this.simNow(speed);
        this.realBase = Date.now();
        this.setState({ speed: v });
      }
    }));

    return {
      accent: accent, accentText: accentText, round: field.length ? String(round) : '–',
      countdown: field.length ? pad(left / 60) + ':' + pad(left % 60) : '–',
      onCourse: String(onCourse), inCorral: String(inCorral), out: String(out),
      dots: dots, runners: runners, speeds: speeds, empty: runners.length === 0
    };
  }
}
return Component;
})();

(function () {
  var mounted = {};
  function show(view, anchor) {
    document.querySelectorAll('[data-view]').forEach(function (el) { el.hidden = el.getAttribute('data-view') !== view; });
    if (!mounted[view]) { mounted[view] = true; mountPage(views[view], 'tpl-' + view, 'page-' + view); }
    var target = anchor && document.getElementById(anchor);
    if (target) target.scrollIntoView();
    else window.scrollTo(0, 0);
  }
  function go(hash) {
    var h = (hash || '').replace(/^#/, '');
    if (h.indexOf('view-') === 0) return show(h.slice(5));
    var el = h && document.getElementById(h);
    var host = el && el.closest('[data-view]');
    show(host ? host.getAttribute('data-view') : 'start', h);
  }
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[href^="#"]');
    if (!a) return;
    var h = a.getAttribute('href');
    if (h === '#') { e.preventDefault(); return; }
    e.preventDefault();
    go(h);
  });
  show('start');
  if (location.hash) go(location.hash);
})();
